# ---------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------
spring.application.name=message-proxy
application.service.name=message-proxy
exss.auth=true
exss.action.auth=false
exss.unauth.url=/ns/

# MINI-JPA PROPERTIES
mini-jpa.validate=false
# ---------------------------------------------------------------------
# Datasource (PostgreSQL)
# ---------------------------------------------------------------------
datasource.exdb.jdbcUrl=jdbc:postgresql://localhost:5432/message-proxy?socketTimeout=60&connectTimeout=10&tcpKeepAlive=true
datasource.exdb.username=admin
datasource.exdb.password=System!

datasource.exdb.driver-class-name=org.postgresql.Driver
datasource.exdb.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
datasource.exdb.hikari.pool-name=message-proxy-pool

# ---------------------------------------------------------------------
# Schema init: tablolar yoksa açılışta otomatik oluşturulur (schema.sql idempotent'tir)
# ---------------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.continue-on-error=false

# ---------------------------------------------------------------------
# OpenFeign (Spring Cloud 2021.0.x property adları "feign." ile başlar)
# ---------------------------------------------------------------------
feign.httpclient.hc5.enabled=true
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=30000
feign.client.config.default.logger-level=basic
# Route bazlı timeout Request.Options ile çağrı anında ezilir
feign.client.config.proxyForwardClient.connect-timeout=5000
feign.client.config.proxyForwardClient.read-timeout=30000

# ---------------------------------------------------------------------
# Redis: route + alan eşleştirme tanımları açılışta buraya yüklenir, isteklerde buradan okunur
# ---------------------------------------------------------------------

#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#spring.data.redis.password=zenerGyPass
#spring.data.redis.username=default

spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=zenerGyPass
spring.redis.username=default

# ---------------------------------------------------------------------
# Proxy
# ---------------------------------------------------------------------
# Feign client'ın zorunlu taban adresi; gerçek hedef her çağrıda proxy_route.target_url ile belirlenir
proxy.forward.default-url=http://localhost
# Proxy giriş prefix'i: POST /proxy/erp/order → proxy_route.source_path = /erp/order
proxy.gateway.prefix=/proxy
# Redis anahtar ön eki ({prefix}:routes, {prefix}:route-patterns, {prefix}:loaded-at)
proxy.cache.key-prefix=message-proxy
# proxy_message_log'a yazılacak istek/cevap gövdesinin maksimum karakter sayısı
proxy.log.max-body-length=100000

# ---------------------------------------------------------------------
# Swagger endpoint senkronizasyonu (swagger_source -> swagger_endpoint)
# ---------------------------------------------------------------------
# false: zamanlayıcı ve açılış senkronizasyonu kapanır; /api/v1/swagger-source/{id}/sync çalışmaya devam eder
swagger.sync.enabled=true
# Uygulama açılırken ACTIVE + auto_sync=1 kaynakları senkronize et
swagger.sync.on-startup=true
# Spring cron (saniye dakika saat gün ay haftanın-günü): her saat başı
swagger.sync.cron=0 0 * * * *
# Swagger dokümanı okuma timeout'ları (ms)
swagger.sync.connect-timeout-ms=5000
swagger.sync.read-timeout-ms=30000

# ---------------------------------------------------------------------
# Token tanımları (auth_profile)
# ---------------------------------------------------------------------
# password / client_secret alanlarını şifrelemek için anahtar (AES-256-GCM; değerin SHA-256 özeti kullanılır).
# Mutlaka ortam değişkeninden verin, dosyaya yazmayın. Üretmek için: openssl rand -base64 32
# Tanımlı değilse şifre içeren tanımlar kaydedilemez. Anahtar değişirse kayıtlı şifreler yeniden girilmelidir.
auth.profile.secret-key=${AUTH_PROFILE_SECRET_KEY:zUF8U0EIBGvJbRwC7ai6vvXprFVdkkk2XLh4GFizWxI=}

# ---------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------
logging.level.tr.com.tatmetal.proxy=INFO
logging.level.tr.com.tatmetal.proxy.client=DEBUG


keycloak.userinfo=https://localhost:8443/realms/zenergy/protocol/openid-connect/userinfo
keycloak.server-url=https://localhost:8443
keycloak.master.username=admin
keycloak.master.password=admin
keycloak.master.client.id=admin-cli


datasource.pgdb.jdbcUrl=jdbc:postgresql://localhost:5432/message-proxy?socketTimeout=60&connectTimeout=10&tcpKeepAlive=true
datasource.pgdb.username=admin
datasource.pgdb.password=System!